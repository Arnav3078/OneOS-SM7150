name: Build OneOS for M51

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test OneOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platforms and Build Tools
        run: |
          sdkmanager --install "platforms;android-37" "platforms;android-36" "build-tools;35.0.0"

      - name: Grant execute permission for scripts and gradlew
        run: |
          chmod +x app-android/gradlew scripts/*.sh

      - name: Build and stage Guest Manager APK
        run: |
          cd scripts && ./build-guest-manager.sh --debug

      - name: Run Core Model & Root Tests
        run: |
          cd app-android
          ./gradlew :core:model:test :core:root:test --stacktrace

      - name: Build OneOS Probe & Full Debug APKs
        run: |
          cd app-android
          ./gradlew :app:assembleProbeDebug :app:assembleFullDebug -Poneos.series=s25 --stacktrace

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-M51-Debug-APKs
          path: |
            app-android/app/build/outputs/apk/full/debug/*.apk
            app-android/app/build/outputs/apk/probe/debug/*.apk
            switcher/assets/guest_manager.apk
