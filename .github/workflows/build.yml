name: Build OneOS
run-name: Build OneOS for Galaxy M51 & A71 (SM7150)

on:
  push:
    branches: [ "main", "Oneios-SM7150" ]
  pull_request:
    branches: [ "main", "Oneios-SM7150" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build & Test OneOS
    runs-on: ubuntu-latest

    env:
      GH_PACKAGES_USER: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          sudo chown -R runner:docker $ANDROID_HOME || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;35.0.0" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" || true

      - name: Grant execute permission for scripts and gradlew
        run: |
          chmod +x app-android/gradlew scripts/*.sh

      - name: Build and stage Guest Manager APK
        run: |
          cd scripts && ./build-guest-manager.sh --debug

      - name: Run Core Model & Root Tests
        run: |
          cd app-android
          ./gradlew :core:model:test :core:root:test --stacktrace

      - name: Build OneOS Probe & Full Debug APKs
        run: |
          cd app-android
          ./gradlew :app:assembleProbeDebug :app:assembleFullDebug -Poneos.series=s25 --stacktrace

      - name: Stage Artifacts
        run: |
          mkdir -p dist
          FULL_APK=$(ls app-android/app/build/outputs/apk/full/debug/*.apk | head -n 1)
          PROBE_APK=$(ls app-android/app/build/outputs/apk/probe/debug/*.apk | head -n 1)
          cp "$FULL_APK" "dist/OneOS-SM7150-full-debug.apk"
          cp "$PROBE_APK" "dist/OneOS-SM7150-probe-debug.apk"
          cp "$FULL_APK" "dist/OneOS-M51-A71-full-debug.apk"
          cp "$PROBE_APK" "dist/OneOS-M51-A71-probe-debug.apk"
          cp "$FULL_APK" "dist/OneiOS-SM7150-full-debug.apk"
          cp switcher/assets/guest_manager.apk "dist/guest_manager.apk"

          # Package SM7150 OneiOS Runtime package
          mkdir -p runtime_pkg
          curl -sL https://github.com/akshaynexus/OneiOS/releases/download/v0.1.18/oneios-runtime-0.1.18-arm64.tar.zst | tar --zstd -C runtime_pkg -xf -
          mkdir -p runtime_pkg/lib/profiles
          cp profiles/ios-16.7-iphonex-sm7150.toml runtime_pkg/lib/profiles/
          cp profiles/host-galaxy-m51-sm7150.toml runtime_pkg/lib/profiles/
          cp profiles/host-galaxy-a71-sm7150.toml runtime_pkg/lib/profiles/
          python3 scripts/package-sm7150-runtime.py runtime_pkg
          tar -C runtime_pkg -cf - . | zstd -19 -T0 > dist/oneios-runtime-0.1.18-arm64.tar.zst
          sha256sum dist/oneios-runtime-0.1.18-arm64.tar.zst | awk '{print $1 "  oneios-runtime-0.1.18-arm64.tar.zst"}' > dist/oneios-runtime-0.1.18-arm64.tar.zst.sha256

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OneOS-SM7150-Debug-APKs
          path: dist/
