name: Build OneOS

on:
  push:
    branches: [ "main", "a71" ]
  pull_request:
    branches: [ "main", "a71" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build & Test OneOS
    runs-on: ubuntu-latest

    env:
      GH_PACKAGES_USER: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          sudo chown -R runner:docker $ANDROID_HOME || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;35.0.0" || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37" || $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" || true

      - name: Grant execute permission for scripts and gradlew
        run: |
          chmod +x app-android/gradlew scripts/*.sh

      - name: Build and stage Guest Manager APK
        run: |
          cd scripts && ./build-guest-manager.sh --debug

      - name: Run Core Model & Root Tests
        run: |
          cd app-android
          ./gradlew :core:model:test :core:root:test --stacktrace

      - name: Build OneOS Probe & Full Debug APKs
        run: |
          cd app-android
          ./gradlew :app:assembleProbeDebug :app:assembleFullDebug -Poneos.series=s25 --stacktrace

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.ref_name == 'a71' && 'OneOS-A71-Debug-APKs' || 'OneOS-M51-Debug-APKs' }}
          path: |
            app-android/app/build/outputs/apk/full/debug/*.apk
            app-android/app/build/outputs/apk/probe/debug/*.apk
            switcher/assets/guest_manager.apk
