# OneiOS Guest Profile: iOS 16.7.10 (20H350) for iPhone X on Snapdragon 730G (SM7150)
# Target Devices: Samsung Galaxy M51 (SM-M515F) & Samsung Galaxy A71 (SM-A715F)
#
# Architecture note:
# iPhone X (iPhone10,3 / iPhone10,6, T8015 A11 Bionic) is standard ARMv8.2-A (arm64).
# It does NOT use ARMv8.3 Pointer Authentication Codes (PAC / arm64e), allowing native
# userland CPU execution on the Kryo 470 cores of the Snapdragon 730G without SIGILL.

[os]
name = "ios-16.7.10-20H350"
arch = "arm64"
darwin = "22.6.0"
xnu_version = "8792.81.2"
ios_version = "16.7.10"
build = "20H350"
device = "iPhone10,6"
device_class = "d221ap"
chip_id = 32789      # 0x8015 (Apple A11)
board_id = 12        # 0x0C

[ipsw]
url = "https://updates.cdn-apple.com/2024FallFCS/fullreinstalls/062-81734/6226DCF7-1C34-4C23-8B39-847250DEB218/iPhone10,6_16.7.10_20H350_Restore.ipsw"
product = "iPhone10,6"
version = "16.7.10"
build = "20H350"
device_class = "d221ap"
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache"]

[display]
width = 1080
height = 2400
refresh_rate = 60
scale_factor = 3.0
backlight_node = "/sys/class/backlight/panel0-backlight/brightness"
backlight_power = "/sys/class/backlight/panel0-backlight/bl_power"

[gpu]
device = "/dev/kgsl-3d0"
driver = "turnip"
vulkan_api = "1.3"
metal_translation = "metal2vulkan"
compositor = "virtio-gpu-3d"

[input]
return_chord = "KEY_VOLUMEDOWN+KEY_POWER"
alt_return_chord = "KEY_VOLUMEUP+KEY_VOLUMEDOWN"
chord_hold_seconds = 3
